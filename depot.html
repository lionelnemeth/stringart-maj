<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>String Art LN — dépôt de projets</title>
<style>
  :root{
    --bg:#111214; --panel:#1c1e22; --panel2:#26292f; --txt:#f2f2f2; --dim:#9aa0a8;
    --orange:#f08c1b; --bleu:#4a9be8; --vert:#3fae6a; --rouge:#d85454;
    --sep:#2c2f36; --img:#2e3138;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--txt); font-size:15px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .page{max-width:900px; margin:0 auto; padding:24px 20px 60px;}
  h1{font-size:22px; margin:0 0 4px;}
  h2{font-size:16px; margin:28px 0 10px;}
  .note{color:var(--dim); font-size:14px; line-height:1.5; margin:6px 0;}
  button{font:inherit; padding:11px 18px; border:none; border-radius:9px;
    background:var(--panel2); color:var(--txt); cursor:pointer;}
  button:hover{filter:brightness(1.18);}
  button:disabled{opacity:.45; cursor:default;}
  .vert{background:var(--vert); color:#111; font-weight:600;}
  .bleu{background:var(--bleu); color:#111; font-weight:600;}
  input{font:inherit; background:var(--panel2); color:var(--txt);
    border:1px solid #3a3e46; border-radius:8px; padding:10px; width:100%;}
  label{display:block; margin:10px 0 4px; color:var(--dim); font-size:14px;}
  .carte{background:var(--panel); border-radius:12px; padding:18px; margin-bottom:18px;}
  #connexion{max-width:360px;}
  #zone{border:2px dashed #3a3e46; border-radius:12px; padding:36px 20px;
    text-align:center; color:var(--dim); cursor:pointer;}
  #zone.survol{border-color:var(--vert); color:var(--txt); background:#1a2620;}
  .ligne{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--sep);
    align-items:flex-start;}
  .ligne:last-child{border-bottom:none;}
  .vign{width:66px; height:88px; object-fit:cover; border-radius:6px;
    background:var(--img); flex:none;}
  .corps{flex:1; min-width:0;}
  .nom{font-weight:600;}
  .info{color:var(--dim); font-size:13px; margin-top:3px; line-height:1.45;}
  .etat{display:inline-block; font-size:12px; font-weight:600; color:#111;
    padding:2px 9px; border-radius:10px; margin-top:6px;}
  .libre{background:var(--vert);} .pris{background:var(--orange);}
  .fini{background:#7d828c;}
  .actes{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap;}
  .actes button{font-size:13px; padding:7px 12px;}
  .jauge{height:5px; background:#33363d; border-radius:3px; margin-top:7px;
    overflow:hidden; max-width:320px;}
  .jauge div{height:100%; background:var(--vert);}
  .err{color:var(--rouge);} .ok{color:var(--vert);}
  select{font:inherit; background:var(--panel2); color:var(--txt);
    border:1px solid #3a3e46; border-radius:8px; padding:8px;}
</style>
</head>
<body>
<div class="page">
  <h1>String Art LN — dépôt de projets</h1>
  <p class="note">Page d'administration du catalogue. Les projets déposés ici
    apparaissent dans l'application de Geoffrey, Nathan et Axelle.</p>

  <div class="carte" id="connexion">
    <label>Pseudo</label>
    <input type="text" id="pseudo" value="lionel" autocomplete="username"
           autocapitalize="none" spellcheck="false">
    <label>Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password">
    <p></p>
    <button class="vert" id="entrer">Se connecter</button>
    <p class="note err" id="err"></p>
  </div>

  <div id="corps" style="display:none;">
    <div class="carte">
      <div id="zone">
        <b>Glisse ici tes fichiers .json</b><br>
        ou clique pour les choisir. Plusieurs à la fois, c'est prévu.
      </div>
      <input type="file" id="fichiers" accept=".json,application/json" multiple hidden>
      <div id="envois"></div>
    </div>

    <h2>Catalogue <button id="recharger" style="font-size:13px; padding:6px 12px;
      margin-left:8px;">Actualiser</button></h2>
    <div class="carte"><div id="liste"><p class="note">Chargement…</p></div></div>
  </div>
</div>

<script>
"use strict";
(function () {
  const $ = id => document.getElementById(id);
  const ADMIN_UID = "EsT0t4o4tFROVoUmudERKFpWR2Y2";
  const DOMAINE = "@stringart.local";
  const MORCEAU = 300000;           // même découpage que l'application

  let annuaire = {}, catalogue = [];
  const moi = () => FB.auth.currentUser;
  const refCat = id => FB.doc(FB.db, "catalogue", id);

  // ---------- connexion ----------
  $("entrer").addEventListener("click", async () => {
    const p = $("pseudo").value.trim(), m = $("mdp").value;
    if (!p || !m) { $("err").textContent = "Pseudo et mot de passe requis."; return; }
    $("err").textContent = "Connexion…";
    $("entrer").disabled = true;
    try {
      const email = p.includes("@") ? p : p.toLowerCase() + DOMAINE;
      await FB.signIn(FB.auth, email, m);
      if (moi().uid !== ADMIN_UID) {
        await FB.signOut(FB.auth);
        throw Object.assign(new Error(""), { code: "pas-admin" });
      }
      $("err").textContent = "";
      $("connexion").style.display = "none";
      $("corps").style.display = "";
      $("mdp").value = "";
      charge();
    } catch (e) {
      const c = (e && e.code) || "";
      $("err").textContent =
        c === "pas-admin" ? "Ce compte n'a pas les droits d'administration."
        : /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)
          ? "Pseudo ou mot de passe incorrect."
        : /network/.test(c) ? "Pas de connexion internet."
        : "Échec de la connexion : " + c;
    } finally { $("entrer").disabled = false; }
  });
  $("mdp").addEventListener("keydown", e => { if (e.key === "Enter") $("entrer").click(); });

  // ---------- dépôt ----------
  const zone = $("zone");
  zone.addEventListener("click", () => $("fichiers").click());
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("survol"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("survol"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("survol");
    traite([...e.dataTransfer.files]);
  });
  $("fichiers").addEventListener("change", e => {
    traite([...e.target.files]); e.target.value = "";
  });

  async function traite(fichiers) {
    const json = fichiers.filter(f => /\.json$/i.test(f.name));
    if (!json.length) { alert("Aucun fichier .json dans la sélection."); return; }
    for (const f of json) {
      const l = document.createElement("p");
      l.className = "note";
      l.textContent = `${f.name} : envoi…`;
      $("envois").appendChild(l);
      try {
        const nom = await depose(await f.text(), f.name);
        l.className = "note ok";
        l.textContent = `${f.name} : déposé sous « ${nom} »`;
      } catch (e) {
        l.className = "note err";
        l.textContent = `${f.name} : échec — ${e && e.message}`;
      }
    }
    charge();
  }

  function formatPlanche(c) {
    const W = Math.round((c && c.width_mm || 0) / 10);
    const H = Math.round((c && c.height_mm || 0) / 10);
    if (!W || !H) return "Autre";
    return Math.min(W, H) + " × " + Math.max(W, H);
  }

  // vignette légère : la preview complète alourdirait l'ouverture du catalogue
  function miniature(b64, taille, qualite) {
    return new Promise(res => {
      if (!b64) return res("");
      const im = new Image();
      im.onload = () => {
        try {
          const e = Math.min(1, (taille || 300) / Math.max(im.width, im.height));
          const cv = document.createElement("canvas");
          cv.width = Math.round(im.width * e); cv.height = Math.round(im.height * e);
          cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
          res(cv.toDataURL("image/jpeg", qualite || 0.6).split(",")[1]);
        } catch (x) { res(""); }
      };
      im.onerror = () => res("");
      im.src = "data:image/jpeg;base64," + b64;
    });
  }

  async function depose(texte, nomFichier) {
    const d = JSON.parse(texte);
    if (!d.path || !d.sides || !d.nails_mm || !d.config)
      throw new Error("ce n'est pas un fichier projet String Art");
    const nom = d.name || nomFichier.replace(/\.json$/i, "");
    const id = "c" + Date.now() + Math.floor(Math.random() * 1000);
    const vignette = await miniature(d.preview_jpeg_b64 || d.photo_jpeg_b64, 300, 0.6);
    const apPrev  = await miniature(d.preview_jpeg_b64, 900, 0.72);
    const apPhoto = await miniature(d.photo_jpeg_b64, 900, 0.72);
    const morceaux = [];
    for (let i = 0; i < texte.length; i += MORCEAU)
      morceaux.push(texte.slice(i, i + MORCEAU));

    const lot = FB.writeBatch(FB.db);
    lot.set(refCat(id), {
      nom, format: formatPlanche(d.config), pas: d.path.length,
      clous: d.nails_mm.length, vignette: vignette || "",
      morceaux: morceaux.length, statut: "disponible",
      prisPar: null, prisParNom: null, avancement: 0, cree: Date.now(),
    });
    morceaux.forEach((t, i) =>
      lot.set(FB.doc(FB.db, "catalogue", id, "data", String(i)), { t }));
    // images moyennes, chargées seulement quand quelqu'un demande l'aperçu
    lot.set(FB.doc(FB.db, "catalogue", id, "apercu", "1"),
            { preview: apPrev || "", photo: apPhoto || "" });
    await lot.commit();
    return nom;
  }

  // ---------- catalogue ----------
  async function charge() {
    try {
      annuaire = {};
      (await FB.getDocsFromServer(FB.collection(FB.db, "utilisateurs")))
        .forEach(d => { annuaire[d.id] = (d.data() || {}).nom || d.id.slice(0, 6); });
      catalogue = [];
      (await FB.getDocsFromServer(FB.collection(FB.db, "catalogue")))
        .forEach(d => catalogue.push(Object.assign({ id: d.id }, d.data())));
      catalogue.sort((a, b) => (b.cree || 0) - (a.cree || 0));
      rend();
    } catch (e) {
      $("liste").innerHTML = `<p class="note err">Chargement impossible : ${e && e.message}</p>`;
    }
  }
  $("recharger").addEventListener("click", charge);

  function rend() {
    const box = $("liste");
    box.innerHTML = "";
    if (!catalogue.length) {
      box.innerHTML = '<p class="note">Le catalogue est vide.</p>';
      return;
    }
    for (const it of catalogue) {
      const l = document.createElement("div");
      l.className = "ligne";
      const img = document.createElement("img");
      img.className = "vign"; img.alt = "";
      if (it.vignette) img.src = "data:image/jpeg;base64," + it.vignette;

      const c = document.createElement("div");
      c.className = "corps";
      const etat = it.statut === "disponible" ? ["libre", "Disponible"]
                 : it.statut === "termine" ? ["fini", "Terminé"]
                 : ["pris", "Pris par " + (it.prisParNom || "?")];
      let info = `${it.format ? it.format + " cm · " : ""}${it.pas} étapes · ${it.clous} clous`;
      if (it.statut !== "disponible" && it.avancement)
        info += `<br>pas ${it.avancement} sur ${it.pas} (${Math.round(it.avancement / it.pas * 100)} %)`
              + ` · ${depuis(it.avancementLe)}`;
      c.innerHTML = `<div class="nom"></div><div class="info">${info}</div>`
                  + `<span class="etat ${etat[0]}">${etat[1]}</span>`;
      c.querySelector(".nom").textContent = it.nom || "projet";

      if (it.statut !== "disponible" && it.avancement) {
        const j = document.createElement("div");
        j.className = "jauge";
        j.innerHTML = `<div style="width:${Math.min(100, it.avancement / it.pas * 100)}%"></div>`;
        c.appendChild(j);
      }

      const a = document.createElement("div");
      a.className = "actes";
      if (it.statut !== "disponible") {
        a.appendChild(bouton("Libérer", async () => {
          if (!confirm(`Libérer « ${it.nom} » ? L'avancement sera effacé.`)) return;
          await FB.updateDoc(refCat(it.id), { statut: "disponible", prisPar: null,
            prisParNom: null, avancement: 0, prisLe: null });
          charge();
        }));
        const sel = document.createElement("select");
        for (const uid of Object.keys(annuaire)) {
          const o = document.createElement("option");
          o.value = uid; o.textContent = annuaire[uid];
          if (uid === it.prisPar) o.selected = true;
          sel.appendChild(o);
        }
        a.appendChild(sel);
        a.appendChild(bouton("Réattribuer", async () => {
          if (!sel.value) return;
          const garde = confirm("Conserver l'avancement actuel ?\n\nOK conserve, Annuler remet à zéro.");
          const maj = { statut: "pris", prisPar: sel.value,
                        prisParNom: annuaire[sel.value] || "",
                        prisLe: FB.serverTimestamp() };
          if (!garde) maj.avancement = 0;
          await FB.updateDoc(refCat(it.id), maj);
          charge();
        }));
      }
      a.appendChild(bouton("Renommer", async () => {
        const v = prompt("Nouveau nom du projet :", it.nom || "");
        if (v === null || !v.trim()) return;
        await FB.updateDoc(refCat(it.id), { nom: v.trim() });
        charge();
      }));
      a.appendChild(bouton("Supprimer", async () => {
        if (!confirm(`Supprimer définitivement « ${it.nom} » du catalogue ?`)) return;
        for (let i = 0; i < (it.morceaux || 1); i++)
          await FB.deleteDoc(FB.doc(FB.db, "catalogue", it.id, "data", String(i))).catch(() => {});
        await FB.deleteDoc(FB.doc(FB.db, "catalogue", it.id, "apercu", "1")).catch(() => {});
        await FB.deleteDoc(refCat(it.id));
        charge();
      }));
      c.appendChild(a);
      l.append(img, c);
      box.appendChild(l);
    }
  }

  // "il y a 3 jours" a partir d'un horodatage Firestore
  function depuis(ts) {
    if (!ts || !ts.toMillis) return "date inconnue";
    const j = Math.floor((Date.now() - ts.toMillis()) / 86400000);
    if (j <= 0) return "mis à jour aujourd'hui";
    if (j === 1) return "mis à jour hier";
    if (j < 31) return `mis à jour il y a ${j} jours`;
    const m = Math.floor(j / 30);
    return `mis à jour il y a ${m} mois`;
  }

  function bouton(txt, fn) {
    const b = document.createElement("button");
    b.textContent = txt;
    b.addEventListener("click", async () => {
      b.disabled = true;
      try { await fn(); } catch (e) { alert("Échec : " + (e && e.message)); }
      b.disabled = false;
    });
    return b;
  }

  // session déjà ouverte dans ce navigateur
  FB.onAuthStateChanged(FB.auth, u => {
    if (u && u.uid === ADMIN_UID) {
      $("connexion").style.display = "none";
      $("corps").style.display = "";
      charge();
    }
  });
})();
</script>
</body>
</html>
